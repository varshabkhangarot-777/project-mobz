<!DOCTYPE html>
<html>
<head>
    <title>Live Users</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#667eea,#8e2de2);
            min-height: 100vh;
            padding: 30px;
        }

        h1{
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        table{
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th{
            background: #6a11cb;
            color: white;
            padding: 15px;
        }

        td{
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even){
            background: #f5f5f5;
        }

        a{
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <h1>Live Connected Users</h1>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Socket ID</th>
            </tr>
        </thead>

        <tbody id="userTable">

        </tbody>

    </table>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        socket.on("userList", (users) => {

            let output = "";

            users.forEach(user => {

                output += `
                    <tr>
                        <td>${user.name}</td>

                        <td>
                            <a href="#" onclick="getUser('${user.email}')">
                                ${user.email}
                            </a>
                        </td>

                        <td>${user.socketId}</td>
                    </tr>
                `;

            });

            document.getElementById("userTable").innerHTML = output;

        });


        async function getUser(email){

            try{

                const response = await fetch(`/users/${email}`);

                const user = await response.json();

                alert(
                    "Name: " + user.firstName + " " + user.lastName +
                    "\nEmail: " + user.email +
                    "\nMobile: " + user.mobile +
                    "\nStreet: " + user.address.street +
                    "\nCity: " + user.address.city +
                    "\nState: " + user.address.state +
                    "\nCountry: " + user.address.country +
                    "\nLogin ID: " + user.loginId
                );

            }
            catch(error){

                console.log(error);
                alert("Error fetching user");

            }

        }

    </script>

</body>
</html>
