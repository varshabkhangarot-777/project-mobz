<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #8e2de2);
            min-height: 100vh;
            padding: 30px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .top-buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: white;
            color: #6a11cb;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #6a11cb;
            color: white;
            padding: 15px;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .email-link {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Live Connected Users</h1>

    <div class="top-buttons">
        <a href="/" class="back-btn">← Back to Registration</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Socket ID</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        socket.on("connect", () => {

            console.log("Connected:", socket.id);

            const savedUser = sessionStorage.getItem("liveUser");

            if (!savedUser) {
                console.log("No saved user found");
                return;
            }

            try {

                const user = JSON.parse(savedUser);

                let clientId = user.clientId;

                if (!clientId) {
                    clientId = sessionStorage.getItem("clientId");
                }

                if (!clientId) {
                    clientId = crypto.randomUUID();
                    sessionStorage.setItem("clientId", clientId);
                }

                const liveUser = {
                    clientId: clientId,
                    firstName: user.firstName,
                    lastName: user.lastName,
                    email: user.email
                };

                sessionStorage.setItem(
                    "liveUser",
                    JSON.stringify(liveUser)
                );

                socket.emit("joinUser", liveUser);

                console.log("Joined live_users:", liveUser);

            } catch (error) {

                console.error("Invalid saved user:", error);

            }
        });

        socket.on("userList", (users) => {

            let output = "";

            if (!users || users.length === 0) {

                output = `
                    <tr>
                        <td colspan="3" class="empty">
                            No Live Users Connected
                        </td>
                    </tr>
                `;

            } else {

                users.forEach(user => {

                    const encodedEmail =
                        encodeURIComponent(user.email);

                    output += `
                        <tr>
                            <td>${user.name}</td>

                            <td>
                                <a
                                    href="#"
                                    class="email-link"
                                    onclick="getUser('${encodedEmail}'); return false;"
                                >
                                    ${user.email}
                                </a>
                            </td>

                            <td>${user.socketId}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById("userTable").innerHTML = output;
        });

        async function getUser(encodedEmail) {

            try {

                const email = decodeURIComponent(encodedEmail);

                const response = await fetch(
                    `/users/${encodeURIComponent(email)}`
                );

                const user = await response.json();

                if (!response.ok) {
                    throw new Error(
                        user.message || "User not found"
                    );
                }

                alert(
                    "Name: " +
                    user.firstName + " " + user.lastName +
                    "\nEmail: " + user.email +
                    "\nMobile: " + user.mobile +
                    "\nStreet: " + (user.address?.street || "") +
                    "\nCity: " + (user.address?.city || "") +
                    "\nState: " + (user.address?.state || "") +
                    "\nCountry: " + (user.address?.country || "") +
                    "\nLogin ID: " + user.loginId
                );

            } catch (error) {

                console.error("User Details Error:", error);
                alert("Error fetching user details");
            }
        }
    </script>

</body>
</html>
