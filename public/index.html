<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-box">

        <h1>User Registration Form</h1>

        <form id="userForm">

            <!-- First Name -->
            <input
                type="text"
                id="firstName"
                placeholder="First Name"
                pattern="[A-Za-z ]+"
                title="Only letters allowed"
                required
            >

            <!-- Last Name -->
            <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                pattern="[A-Za-z ]+"
                title="Only letters allowed"
                required
            >

            <!-- Mobile -->
            <input
                type="tel"
                id="mobile"
                placeholder="Mobile Number"
                maxlength="10"
                pattern="[0-9]{10}"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                title="Enter exactly 10 digits"
                required
            >

            <!-- Email -->
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <!-- Street -->
            <input
                type="text"
                id="street"
                placeholder="Street"
            >

            <!-- City -->
            <input
                type="text"
                id="city"
                placeholder="City"
                pattern="[A-Za-z ]+"
                title="Only letters allowed"
            >

            <!-- State -->
            <input
                type="text"
                id="state"
                placeholder="State"
                pattern="[A-Za-z ]+"
                title="Only letters allowed"
            >

            <!-- Country -->
            <input
                type="text"
                id="country"
                placeholder="Country"
                pattern="[A-Za-z ]+"
                title="Only letters allowed"
            >

            <!-- Login ID -->
            <input
                type="text"
                id="loginId"
                placeholder="Login ID (8 Characters)"
                minlength="8"
                maxlength="8"
                pattern="[A-Za-z0-9]{8}"
                title="Exactly 8 alphanumeric characters"
                required
            >

            <!-- Password -->
            <input
                type="password"
                id="password"
                placeholder="Password"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{6,}$"
                title="Password must contain 1 uppercase, 1 lowercase, 1 special character and minimum 6 characters"
                required
            >

            <button type="submit">Save User</button>

            <br><br>

            <a href="users.html">
                <button type="button">View Saved Users</button>
            </a>

        </form>

    </div>
</div>

<script src="app.js"></script>

</body>
</html>
