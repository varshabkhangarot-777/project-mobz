<!DOCTYPE html>
<html>
<head>
<title>All Users</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:40px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

th{
background:#6a11cb;
color:white;
}

</style>

</head>

<body>

<h1>Registered Users</h1>

<table>

<thead>
<tr>
<th>First Name</th>
<th>Last Name</th>
<th>Mobile</th>
<th>Email</th>
<th>City</th>
<th>Country</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

<script>

fetch("/users")
.then(res => res.json())
.then(data=>{

let output="";

data.forEach(user=>{

output += `
<tr>
<td>${user.firstName}</td>
<td>${user.lastName}</td>
<td>${user.mobile}</td>
<td>${user.email}</td>
<td>${user.address.city}</td>
<td>${user.address.country}</td>
</tr>
`;

});

document.getElementById("userTable").innerHTML = output;

});

</script>

</body>
</html>
